name: Desktop builds
on:
  workflow_dispatch:
  push:
    branches: [feature/app]
  pull_request:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:prepare
      - run: npm run test:desktop
      - run: npm run test:extension
      - run: npm run desktop:smoke
      - run: npm run desktop:package -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Clearspace-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
